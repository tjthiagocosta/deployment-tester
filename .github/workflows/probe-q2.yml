name: probe-q2-env-secret
on:
  workflow_dispatch: {}

jobs:
  probe:
    name: probe-q2-job
    runs-on: ubuntu-latest
    environment: probe-env
    steps:
      - name: report secret length
        env:
          SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          echo "PROBE-SECRET-LEN=${#SECRET}"
          echo "PROBE-RAN-ON-REF=${GITHUB_REF_NAME}"
