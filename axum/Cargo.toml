[package]
name = "axum-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

# Keep the release build cheap: the canary is a 2 GB box and a full opt-level 3
# LTO build of the tokio/axum tree is the most likely thing to OOM there.
[profile.release]
opt-level = 1
debug = false
incremental = false
codegen-units = 16
