name: probe-q3-repo-secret-env-gate
on:
  workflow_dispatch: {}

jobs:
  probe:
    name: probe-q3-job
    runs-on: ubuntu-latest
    environment: probe-env
    steps:
      - name: report repo secret length
        env:
          SECRET: ${{ secrets.PROBE_REPO_SECRET }}
        run: |
          echo "PROBE-SECRET-LEN=${#SECRET}"
          echo "PROBE-RAN-ON-REF=${GITHUB_REF_NAME}"
